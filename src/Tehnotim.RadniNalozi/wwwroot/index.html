<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tehnotim radni nalozi</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<main>
  <div class="card">
    <h1>Dobro došli</h1>
    <p class="muted" id="pozdrav"></p>
  </div>
  <div class="card">
    <div class="akcije" style="margin-top:0"><h2 style="flex:1;margin:0">Posljednji nalozi</h2><a href="nalozi.html">Svi nalozi →</a><a href="nalog.html"><button class="primary">+ Novi nalog</button></a></div>
    <div class="tablebox" style="margin-top:10px"><table>
      <thead><tr><th>Broj</th><th>Datum</th><th>Klijent / jedinica</th><th>Nosilac</th><th>Faza</th></tr></thead>
      <tbody id="nalozi"><tr><td colspan="5" class="muted">Učitavam…</td></tr></tbody>
    </table></div>
  </div>
  <div class="card">
    <h2>Stanje sistema</h2>
    <div id="status">Provjeravam…</div>
  </div>
  <div class="card" id="tabele-card" hidden><h2>Tabele u bazi</h2><div id="tabele" class="muted mono"></div></div>
  <div class="card" id="skripte-card" hidden><h2>Izvršene skripte</h2><div id="skripte"></div></div>
</main>
<script src="zaglavlje.js"></script>
<script>
(async () => {
  const ja = await ucitajZaglavlje('pocetna');
  if (!ja.registrovan) return;

  document.getElementById('pozdrav').innerHTML =
    `Prijavljeni ste kao <b class="mono">${esc(ja.nalog)}</b>, uloga: <b>${NAZIVI_ULOGA[ja.uloga]}</b>.` +
    (ja.uloga === 'administrator' && !ja.ime ? ' Upišite svoje ime u meniju Korisnici.' : '');

  const FAZE = { novo_iz_tiketa: 'Novo iz tiketa', u_radu: 'U radu', ceka_potpis: 'Čeka potpis', zavrsen: 'Završen' };
  const BOJE = { u_radu: '', ceka_potpis: 'warn', zavrsen: 'ok', novo_iz_tiketa: '' };
  const nalozi = (await fetch('/api/nalozi?velicina=15').then(r => r.json())).nalozi;
  document.getElementById('nalozi').innerHTML = nalozi.length ? nalozi.slice(0, 15).map(n => `<tr class="klik" data-id="${n.id}">
      <td class="mono">${esc(n.broj)}${n.pozivInterni ? `<div class="muted">zahtjev ${esc(n.pozivInterni)}</div>` : ''}</td>
      <td>${n.datumIzdavanja.slice(0, 10).split('-').reverse().join('.')}.</td>
      <td>${esc(n.klijentNaziv)}<div class="muted">${esc(n.lokacija || '')}</div></td>
      <td>${esc(n.nosilacIme || '')}</td>
      <td><span class="chip ${BOJE[n.faza]}" style="${BOJE[n.faza] ? '' : 'background:var(--sunk)'}">${FAZE[n.faza]}</span></td></tr>`).join('')
    : '<tr><td colspan="5" class="muted">Još nema naloga. Kliknite „+ Novi nalog”.</td></tr>';
  document.querySelectorAll('#nalozi tr[data-id]').forEach(tr => tr.onclick = () => location.href = `nalog.html?id=${tr.dataset.id}`);

  const s = await fetch('/api/status').then(r => r.json());
  const chip = (ok, t) => `<span class="chip ${ok ? 'ok' : 'bad'}">${esc(t)}</span>`;
  let html = `<div class="row"><span>Aplikacija</span>${chip(true, 'radi')}</div>`;
  html += `<div class="row"><span>SQL Server</span>${chip(s.baza === 'povezana', s.baza)}</div>`;
  if (s.imeBaze) html += `<div class="row"><span>Baza</span><b>${esc(s.imeBaze)}</b></div>`;
  if (s.sqlServer) html += `<p class="muted">${esc(s.sqlServer)}</p>`;
  if (s.greska) html += `<p>Poruka greške (pošaljite je u razgovoru):</p><pre>${esc(s.greska)}</pre>`;
  document.getElementById('status').innerHTML = html;

  if (s.tabele?.length) {
    document.getElementById('tabele').textContent = s.tabele.join(', ');
    document.getElementById('tabele-card').hidden = false;
  }
  if (s.skripte?.length) {
    document.getElementById('skripte').innerHTML = s.skripte.map(k =>
      `<div class="row"><span class="mono">${esc(k.skripta)}</span><span class="muted">${new Date(k.primijenjeno + 'Z').toLocaleString('bs-BA')}</span></div>`).join('');
    document.getElementById('skripte-card').hidden = false;
  }
})();
</script>
</body>
</html>
