<title>Tehnotim radni nalozi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: navy top band with tabs; work area is a stack of form sections that read like the paper nalog's grey label cells */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#e4e8ee; --line:#cfd6df; --ink:#16212d; --muted:#5a6676;
  --accent:#c3262d; --accent-ink:#ffffff; --band:#1d2b3b; --on-band:#ffffff; --on-band-dim:#a9b6c6;
  --ok:#1d7a4a; --ok-bg:#dcf1e5; --warn:#9a5b00; --warn-bg:#fbecd2; --info:#1f5a96; --info-bg:#dde9f6;
  --paper:#ffffff; --paper-ink:#111111;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --sunk:#202a36; --line:#2e3a48; --ink:#e5eaf0; --muted:#94a1b2;
  --accent:#ea5b61; --accent-ink:#1a0606; --band:#0a0f15; --on-band:#ffffff; --on-band-dim:#8d9aab;
  --ok:#6fd39e; --ok-bg:#163327; --warn:#f0b35a; --warn-bg:#3a2a12; --info:#8cbcf0; --info-bg:#172c44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --sunk:#202a36; --line:#2e3a48; --ink:#e5eaf0; --muted:#94a1b2;
  --accent:#ea5b61; --accent-ink:#1a0606; --band:#0a0f15; --on-band:#ffffff; --on-band-dim:#8d9aab;
  --ok:#6fd39e; --ok-bg:#163327; --warn:#f0b35a; --warn-bg:#3a2a12; --info:#8cbcf0; --info-bg:#172c44; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--on-band);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.band .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.logochip{background:var(--paper);border-radius:6px;padding:5px 9px;display:inline-flex;align-items:center}
.logochip img{height:24px;width:auto;display:block}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--on-band-dim);text-transform:uppercase;letter-spacing:.08em}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{background:none;border:0;color:var(--on-band-dim);font:600 14px var(--f-body);padding:8px 12px;border-radius:6px;cursor:pointer}
nav.tabs button:hover{color:var(--on-band)}
nav.tabs button[aria-current="page"]{color:var(--on-band);background:rgba(255,255,255,.1)}
nav.tabs button.new{background:var(--accent);color:var(--accent-ink)}
main{padding-block:22px 80px}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head .sp{flex:1}
.mono{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,.btn{font:600 14px var(--f-body);border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{color:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input[readonly]{background:var(--sunk)}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);min-height:1em}
.hint.ok{color:var(--ok)} .hint.new{color:var(--warn)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;display:grid;grid-template-columns:150px 1fr;overflow:hidden}
.sec>.lab{background:var(--sunk);padding:14px;font-family:var(--f-display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-right:1px solid var(--line)}
.sec>.body{padding:14px;display:grid;gap:12px;min-width:0}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.pozivgrp{grid-column:span 2;display:grid;gap:6px;min-width:0}
.pz2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.pozivgrp{grid-column:1/-1}}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
@media (max-width:640px){.sec{grid-template-columns:1fr}.sec>.lab{border-right:0;border-bottom:1px solid var(--line);padding:10px 14px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg label{display:flex;align-items:center;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{padding:7px 12px;font-weight:600;font-size:14px;border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--band);color:var(--on-band)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.yn{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap}
.yn h2{min-width:9.5em}
.rows{display:grid;gap:8px}
.row{display:grid;gap:8px;align-items:start}
.row.dev{grid-template-columns:1.2fr 1.2fr 1fr 1fr auto}
.devcard{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px}
.devcard .cnt{display:grid;gap:10px;padding:12px;background:var(--sunk);border-radius:6px}
.devcard .cnt input:not([readonly]){background:var(--surface)}
.cnt-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row.mat{grid-template-columns:2fr 90px 1fr auto}
@media (max-width:560px){.row.dev,.row.mat{grid-template-columns:1fr 1fr}.row .x{grid-column:span 2;justify-self:end}}
.calc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.calc input{width:90px}
.sum{font-family:var(--f-mono);font-weight:500;font-size:16px}
.sigs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sig{display:grid;gap:6px}
.sig canvas{width:100%;aspect-ratio:3/1;max-width:100%;background:var(--paper);border:1px dashed var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.sig .top{display:flex;justify-content:space-between;align-items:center}
.signame{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600;font-size:15px}
.signame .muted{font-weight:400;font-size:13px}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.check input{width:auto}
.actions{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:4}
.actions .sp{flex:1}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.chip.u_radu{background:var(--info-bg);color:var(--info)}
.chip.ceka_potpis{background:var(--warn-bg);color:var(--warn)}
.chip.zavrsen{background:var(--ok-bg);color:var(--ok)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border-radius:999px;padding:5px 12px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--band);color:var(--on-band);border-color:var(--band)}
.search{max-width:280px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:34px 22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:6px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-weight:500}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.list{display:grid}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:8px}
.list .it:last-child{border-bottom:0}
.addrow{display:flex;gap:8px}
.lokrow{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.lokrow input{background:var(--surface)}
.overlay{position:fixed;inset:0;background:rgba(8,12,18,.5);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--on-band);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.prev{font-size:13px;color:var(--muted)}
#print-root{position:fixed;left:-10000px;top:0;width:794px;background:var(--paper);color:var(--paper-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* print sheet (always paper) */
.ps{width:794px;padding:40px 46px;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:var(--paper-ink);background:var(--paper)}
.ps .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ps .logoimg{height:46px;width:auto}
.ps .logo b{font-weight:800}.ps .logo i{font-style:normal;font-weight:400}
.ps .logo em{color:#c3262d;font-style:normal;font-weight:800}
.ps .co{font-size:10px;font-weight:700;line-height:1.4}
.ps table{width:100%;border-collapse:collapse;border:2px solid #000}
.ps td,.ps th{border:1px solid #000;padding:4px 6px;font-size:11px;vertical-align:middle;background:#fff;color:#000;text-transform:none;letter-spacing:0}
.ps table.main{table-layout:fixed}
.ps table.top{border-bottom:0}
.ps table.top tr:last-child td{border-bottom:0}
.ps table.bot{border-top-width:1px}
.ps .l{background:#e6e6e6;font-weight:700}
.ps .sm{font-size:9.5px;padding-left:2px;padding-right:2px}
.ps td{overflow-wrap:anywhere}
.ps .t{background:#e6e6e6;font-weight:700;text-align:center;font-size:17px}
.ps .c{text-align:center}
.ps .x{font-weight:700;background:#d9d9d9}
.ps .big{height:70px;vertical-align:top;white-space:pre-wrap}
.ps .bigger{height:140px;vertical-align:top;white-space:pre-wrap}
.ps .sigimg{height:42px}
.ps table.pz{border:0;width:100%;height:100%}
.ps .pz td{width:50%;font-size:10px;padding:2px 4px;border-top:0;border-left:0}
.ps .pz tr:last-child td{border-bottom:0;font-size:11px;font-weight:700}
.ps .pz td:last-child{border-right:0}
.ps .ft{text-align:center;font-size:9px;font-weight:700;margin-top:10px}
</style>

<header class="band"><div class="wrap">
  <div class="brand"><span class="logochip"><img id="brand-logo" alt="Tehnotim"></span><small>Radni nalozi</small></div>
  <nav class="tabs" id="tabs">
    <button data-v="nalozi">Nalozi</button>
    <button data-v="klijenti">Klijenti</button>
    <button data-v="uredjaji">Uređaji</button>
    <button data-v="sifarnici">Šifarnici</button>
    <button data-v="novi" class="new">+ Novi nalog</button>
  </nav>
</div></header>

<main class="wrap" id="main">
  <div id="banner" class="banner" hidden></div>
  <section id="v-nalozi"></section>
  <section id="v-nalog" hidden></section>
  <section id="v-klijenti" hidden></section>
  <section id="v-uredjaji" hidden></section>
  <section id="v-sifarnici" hidden></section>
</main>

<datalist id="dl-klijenti"></datalist>
<datalist id="dl-uredjaji"></datalist>
<datalist id="dl-materijali"></datalist>
<datalist id="dl-lokacije"></datalist>
<div id="modal-root"></div>
<div id="print-root"></div>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const nowDT=()=>{const d=new Date();return `${today()}T${p2(d.getHours())}:${p2(d.getMinutes())}`};
const fD=s=>{if(!s)return'';const[y,m,d]=s.slice(0,10).split('-');return `${d}.${m}.${y}.`};
const fDT=s=>!s?'':fD(s)+(s.length>10?' '+s.slice(11,16):'');
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const fmtNum=n=>(Math.round(n*100)/100).toLocaleString('bs-BA',{maximumFractionDigits:2});
const norm=s=>String(s||'').trim().toLowerCase();
const FAZE={u_radu:'U radu',ceka_potpis:'Čeka potpis',zavrsen:'Završen'};

let db=null, downloads=null;
const S={klijenti:[],uredjaji:[],materijali:[],serviseri:[],tipovi:[],nalozi:[],postavke:{},brojac:{},ready:false};
let view='nalozi', filter='sve', q='', cur=null; // cur = nalog being edited

function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function banner(t){const b=$('#banner');b.textContent=t||'';b.hidden=!t}
const kById=id=>S.klijenti.find(k=>k.id===id);
const kByName=n=>S.klijenti.find(k=>norm(k.naziv)===norm(n));
const uBySer=s=>S.uredjaji.find(u=>norm(u.serijski)===norm(s));
const newId=()=>'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* klijent ima više poslovnih jedinica; stari zapisi s jednom lokacijom se čitaju kao jedna jedinica */
function lokacijeOf(k){
  if(!k)return[];
  if(Array.isArray(k.lokacije))return k.lokacije;
  return k.lokacija||k.adresa?[{id:'l0',naziv:k.lokacija||'',mjesto:'',adresa:k.adresa||'',km:k.km||0,kontakt:k.kontakt||'',telefon:k.telefon||'',email:k.email||''}]:[];
}
const lokLabel=l=>l?.naziv||l?.mjesto||l?.adresa||'';
const findLok=(k,name)=>lokacijeOf(k).find(l=>norm(lokLabel(l))===norm(name));
const lokById=(k,id)=>lokacijeOf(k).find(l=>l.id===id);

/* ---------- views ---------- */
function show(v){
  if(v==='novi'){openNalog(null);return}
  view=v;
  ['nalozi','nalog','klijenti','uredjaji','sifarnici'].forEach(n=>$('#v-'+n).hidden=n!==v);
  $$('#tabs button').forEach(b=>b.toggleAttribute('aria-current',false));
  const t=$(`#tabs button[data-v="${v}"]`); if(t)t.setAttribute('aria-current','page');
  if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v)}catch(e){}}
  render(); window.scrollTo(0,0);
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)});
function render(){
  fillLists();
  if(view==='nalozi')renderNalozi();
  else if(view==='klijenti')renderKlijenti();
  else if(view==='uredjaji')renderUredjaji();
  else if(view==='sifarnici')renderSifarnici();
  else if(view==='nalog')refreshNalogSelects();
}
function fillLists(){
  $('#dl-klijenti').innerHTML=S.klijenti.map(k=>{const n=lokacijeOf(k).length;return `<option value="${esc(k.naziv)}">${n} ${n===1?'poslovna jedinica':'poslovnih jedinica'}</option>`}).join('');
  $('#dl-uredjaji').innerHTML=S.uredjaji.map(u=>{const k=kById(u.klijentId);return `<option value="${esc(u.serijski)}">${esc(u.model)} · ${esc(k?.naziv||'')} ${esc(lokLabel(lokById(k,u.lokacijaId)))}</option>`}).join('');
  fillLokList();
  $('#dl-materijali').innerHTML=S.materijali.map(m=>`<option value="${esc(m.naziv)}"></option>`).join('');
}

/* ---------- lista naloga ---------- */
function renderNalozi(){
  const el=$('#v-nalozi');
  const cnt={sve:S.nalozi.length,u_radu:0,ceka_potpis:0,zavrsen:0};
  S.nalozi.forEach(n=>cnt[n.faza]=(cnt[n.faza]||0)+1);
  const qq=norm(q);
  const rows=S.nalozi.filter(n=>(filter==='sve'||n.faza===filter)&&(!qq||[n.broj,n.poziv,n.pozivEksterni,n.klijentNaziv,n.lokacija,n.nosilac,...(n.uredjaji||[]).flatMap(u=>[u.serijski,u.model,u.inventurni])].some(x=>norm(x).includes(qq))));
  const focused=document.activeElement?.id==='q';
  el.innerHTML=`<div class="head"><h1>Radni nalozi</h1><div class="sp"></div>
    <input id="q" class="search" type="search" placeholder="Traži broj, tiket, klijenta, serijski…" value="${esc(q)}">
  </div>
  <div class="head filters" role="group" aria-label="Filter">

   rows.length===0?`<div class="empty">Nema naloga za ovaj filter.</div>`:
  `<div class="tablebox"><table><thead><tr><th>Broj</th><th>Datum</th><th>Klijent</th><th>Uređaj</th><th>Nosilac</th><th>Status</th></tr></thead><tbody>
  ${rows.map(n=>{const u=(n.uredjaji||[])[0]||{};return `<tr class="click" data-id="${esc(n.id)}"><td class="mono">${esc(n.broj)}${n.pozivEksterni?`<div class="muted" style="font-size:12px" title="Tiket klijenta">tiket ${esc(n.pozivEksterni)}</div>`:''}</td><td>${fD(n.datum)}</td><td>${esc(n.klijentNaziv)}<div class="muted" style="font-size:13px">${esc(n.lokacija)}</div></td><td>${esc(u.model||'')}<div class="muted mono" style="font-size:12px">${esc(u.serijski||'')}</div></td><td>${esc(n.nosilac)}</td><td><span class="chip ${esc(n.faza)}">${FAZE[n.faza]||''}</span></td></tr>`}).join('')}
  </tbody></table></div>`}`;
  const qi=$('#q');qi.oninput=()=>{q=qi.value;renderNalozi()};
  if(focused){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderNalozi()});
  el.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openNalog(r.dataset.id));
  const f=$('#first');if(f)f.onclick=()=>openNalog(null);
}

/* ---------- forma naloga ---------- */
function seg(name,opts){return `<div class="seg" role="radiogroup">${opts.map(o=>`<label><input type="radio" name="${name}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`}
const getR=n=>document.querySelector(`input[name="${n}"]:checked`)?.value||'';
const setR=(n,v)=>$$(`input[name="${n}"]`).forEach(i=>i.checked=i.value===v);

function openNalog(id){
  const src=id?S.nalozi.find(n=>n.id===id):null;
  cur=src?JSON.parse(JSON.stringify(src)):{datum:today(),pocetak:'',kraj:'',zahtjevVrijeme:nowDT(),naplata:'',ugovor:'',garancija:'',uredjaji:[{serijski:'',model:''}],materijal:[{naziv:'',kolicina:'',otpremnica:''}],tarifa:S.postavke.tarifaKm||'',status:'',intervencija:''};
  const d0=cur.uredjaji?.[0];if(d0&&(cur.kolor||cur.cb)&&d0.kolor==null&&d0.cb==null){d0.kolor=cur.kolor;d0.cb=cur.cb}
  view='nalog';
  ['nalozi','nalog','klijenti','uredjaji','sifarnici'].forEach(n=>$('#v-'+n).hidden=n!=='nalog');
  $$('#tabs button').forEach(b=>b.removeAttribute('aria-current'));
  if(!id)$('#tabs button[data-v="novi"]').setAttribute('aria-current','page');
  buildForm(); fillLists(); window.scrollTo(0,0);
}

  <div class="actions"><button class="primary" id="save">Sačuvaj nalog</button><button id="print">Štampaj</button><button id="pdf">Sačuvaj PDF</button><span class="muted" id="save-state"></span><span class="muted mono" id="file-name" style="font-size:12px"></span><div class="sp"></div>${n.id?'<button class="ghost" id="del">Obriši nalog</button>':''}</div>`;

  $('#back').onclick=()=>show('nalozi');
  $('#f-poziv').value=n.poziv||''; $('#f-pozivx').value=n.pozivEksterni||''; $('#f-datum').value=n.datum||''; $('#f-zahtjev').value=n.zahtjevVrijeme||'';
  $('#f-pocetak').value=n.pocetak||''; $('#f-kraj').value=n.kraj||'';
  vrijemeRucno=!!n.vrijemeRucno; $('#f-vrijeme').value=n.vrijeme||'';
  $('#f-vrijeme').addEventListener('change',onVrijemeInput);
  $('#f-klijent').value=n.klijentNaziv||''; $('#f-lokacija').value=n.lokacija||''; $('#f-adresa').value=n.adresa||''; $('#f-kontakt').value=n.kontakt||''; $('#f-predao').value=n.predao||'';
  setR('naplata',n.naplata);setR('ugovor',n.ugovor);setR('garancija',n.garancija);setR('status',n.status);setR('interv',n.intervencija);
  $('#f-opisz').value=n.opisZahtjeva||''; $('#f-opisi').value=n.opisIntervencije||'';
  $('#f-dest').value=n.dest||''; $('#f-km1').value=n.km1??''; $('#f-km2').value=n.km2??''; $('#f-tarifa').value=n.tarifa??'';
  $('#f-kasnije').checked=!!n.potpisKasnije;
  refreshNalogSelects(n.nosilac||'');
  const sigName=()=>{const v=$('#f-nosilac').value;$('#sig-s-name').textContent=v||'Izaberi nosioca naloga gore';$('#sig-s-name').className=v?'':'muted'};
  $('#f-nosilac').addEventListener('change',sigName); sigName();
  renderDevRows(n.uredjaji); renderMatRows(n.materijal);
  klijentHint(); calcTime(); calcTravel();
  padS=pad($('#sig-s'),n.potpisServiser); padK=pad($('#sig-k'),n.potpisKorisnik);
  $$('[data-clear]').forEach(b=>b.onclick=()=>(b.dataset.clear==='s'?padS:padK).clear());

  $('#f-klijent').addEventListener('change',onKlijent);
  $('#f-klijent').addEventListener('input',()=>{klijentHint();fillLokList()});

  $('#f-lokacija').addEventListener('focus',fillLokList);

  $('#f-datum').addEventListener('change',()=>autoGarancija());
  $('#add-dev').onclick=()=>{collectRows();cur.uredjaji.push({serijski:'',model:''});renderDevRows(cur.uredjaji)};
  $('#add-mat').onclick=()=>{collectRows();cur.materijal.push({naziv:'',kolicina:'',otpremnica:''});renderMatRows(cur.materijal)};

function refreshNalogSelects(keep){
  const s=$('#f-nosilac');if(!s)return;
  const v=keep!==undefined?keep:s.value;
  const names=S.serviseri.map(x=>x.ime);if(v&&!names.includes(v))names.push(v);
  s.innerHTML=`<option value="">— izaberi —</option>`+names.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
  if(!S.serviseri.length)s.title='Servisere dodaj u Šifarnicima';
  $$('#dev-rows .devcard').forEach(r=>{const t=r.querySelector('.d-tip'),v=t.value;t.innerHTML=tipOptions(v);t.value=v;updateCnt(r)});
}
const tipById=id=>S.tipovi.find(t=>t.id===id);
const pratiBrojac=(tipId,u)=>{const t=tipById(tipId);if(t)return !!t.brojac;return !!(u&&(u.zadnjiKolor!=null||u.zadnjiCb!=null))};
function tipOptions(sel){
  const ts=[...S.tipovi];if(sel&&!tipById(sel))ts.push({id:sel,naziv:'(obrisan tip)'});
  return `<option value="">— tip —</option>`+ts.map(t=>`<option value="${esc(t.id)}"${t.id===sel?' selected':''}>${esc(t.naziv)}</option>`).join('');
}
function renderDevRows(list){
  $('#dev-rows').innerHTML=list.map((u,i)=>`<div class="devcard" data-i="${i}">
    <div class="row dev">
    <label class="f"><span>Serijski broj</span><input class="d-ser mono" list="dl-uredjaji" autocomplete="off" value="${esc(u.serijski)}"><span class="hint d-h"></span></label>
    <label class="f"><span>Model uređaja</span><input class="d-mod" value="${esc(u.model)}"></label>
    <label class="f"><span>Inventurni broj</span><input class="d-inv mono" value="${esc(u.inventurni||'')}"></label>
    <label class="f"><span>Tip uređaja</span><select class="d-tip">${tipOptions(u.tipId||'')}</select></label>
    <button class="ghost x" title="Ukloni uređaj" style="margin-top:20px" ${list.length<2?'hidden':''}>✕</button></div>
    <div class="cnt" hidden>
      <div class="cnt-head"><h2>Broj odštampanih strana</h2><label class="check"><input type="checkbox" class="d-mono" ${u.samoCb?'checked':''}> Samo crno-bijeli</label></div>
      <div class="g">
        <label class="f d-kol-w"><span>Kolor</span><input class="d-kol mono" inputmode="numeric" value="${esc(u.kolor??'')}"></label>
        <label class="f"><span>Crno-bijele</span><input class="d-cb mono" inputmode="numeric" value="${esc(u.cb??'')}"></label>
        <label class="f"><span>Ukupno</span><input class="d-uk mono" readonly></label>
      </div>
      <div class="prev d-prev"></div>
    </div></div>`).join('');
  $$('#dev-rows .devcard').forEach(r=>{
    const ser=r.querySelector('.d-ser');
    ser.addEventListener('change',()=>onSerial(r));
    ser.addEventListener('input',()=>{devHint(r);updateCnt(r)});
    r.querySelector('.d-inv').addEventListener('change',e=>{
      const v=norm(e.target.value);if(!v||ser.value.trim())return;
      const u=S.uredjaji.find(x=>norm(x.inventurni)===v);if(u){ser.value=u.serijski;onSerial(r)}
    });
    r.querySelector('.d-mod').addEventListener('change',e=>{
      const sel=r.querySelector('.d-tip');if(sel.value)return;
      const m=norm(e.target.value);const o=m&&S.uredjaji.find(x=>norm(x.model)===m&&x.tipId);
      if(o){sel.value=o.tipId;if(o.samoCb)r.querySelector('.d-mono').checked=true;updateCnt(r)}
    });
    r.querySelector('.d-tip').addEventListener('change',()=>updateCnt(r));
    r.querySelector('.d-mono').addEventListener('change',()=>updateCnt(r));
    ['.d-kol','.d-cb'].forEach(c=>r.querySelector(c).addEventListener('input',()=>updateCnt(r)));
    r.querySelector('.x').onclick=()=>{collectRows();cur.uredjaji.splice(+r.dataset.i,1);renderDevRows(cur.uredjaji)};
    devHint(r);updateCnt(r);
  });
}
function updateCnt(r){
  const u=uBySer(r.querySelector('.d-ser').value.trim());
  const show=pratiBrojac(r.querySelector('.d-tip').value,u);
  const box=r.querySelector('.cnt');box.hidden=!show;if(!show)return;
  const mono=r.querySelector('.d-mono').checked;
  r.querySelector('.d-kol-w').hidden=mono;
  const kv=mono?'':r.querySelector('.d-kol').value,cv=r.querySelector('.d-cb').value;
  r.querySelector('.d-uk').value=(kv||cv)?num(kv)+num(cv):'';
  const p=r.querySelector('.d-prev');
  if(u&&(u.zadnjiKolor!=null||u.zadnjiCb!=null)){
    let t=`Prethodno stanje (${fD(u.brojacDatum)||'—'}): `+(mono?'':`kolor ${u.zadnjiKolor??'—'}, `)+`crno-bijele ${u.zadnjiCb??'—'}.`;
    const k=num(kv),c=num(cv);
    if(k||c)t+=' Razlika: '+(mono?'':`kolor ${k?k-(u.zadnjiKolor||0):'—'}, `)+`crno-bijele ${c?c-(u.zadnjiCb||0):'—'}.`;
    p.textContent=t;
  } else p.textContent='';
}
function renderMatRows(list){
  $('#mat-rows').innerHTML=list.map((m,i)=>`<div class="row mat" data-i="${i}">
    <input class="m-n" list="dl-materijali" aria-label="Materijal" value="${esc(m.naziv)}">
    <input class="m-k" inputmode="decimal" aria-label="Količina" value="${esc(m.kolicina)}">
    <input class="m-o" aria-label="Broj otpremnice" value="${esc(m.otpremnica)}">
    <button class="ghost x" title="Ukloni">✕</button></div>`).join('');
  $$('#mat-rows .row').forEach(r=>r.querySelector('.x').onclick=()=>{collectRows();cur.materijal.splice(+r.dataset.i,1);if(!cur.materijal.length)cur.materijal.push({naziv:'',kolicina:'',otpremnica:''});renderMatRows(cur.materijal)});
}
function collectRows(){
  cur.uredjaji=$$('#dev-rows .devcard').map(r=>{
    const show=!r.querySelector('.cnt').hidden,mono=r.querySelector('.d-mono').checked;
    return {serijski:r.querySelector('.d-ser').value.trim(),model:r.querySelector('.d-mod').value.trim(),inventurni:r.querySelector('.d-inv').value.trim(),
      tipId:r.querySelector('.d-tip').value,samoCb:mono,brojac:show,
      kolor:show&&!mono?r.querySelector('.d-kol').value.trim():'',cb:show?r.querySelector('.d-cb').value.trim():'',ukupno:show?r.querySelector('.d-uk').value:''};
  });
  cur.materijal=$$('#mat-rows .row').map(r=>({naziv:r.querySelector('.m-n').value.trim(),kolicina:r.querySelector('.m-k').value.trim(),otpremnica:r.querySelector('.m-o').value.trim()}));
}
function klijentHint(){
  const v=$('#f-klijent').value.trim(),h=$('#h-klijent');
  if(!v){h.textContent='';h.className='hint';return}
  if(kByName(v)){h.textContent='✓ Klijent iz baze';h.className='hint ok'}
  else{h.innerHTML='Novi klijent, biće dodan u bazu pri čuvanju. <button class="ghost" id="k-full" style="padding:0 4px">Unesi detalje</button>';h.className='hint new';
    $('#k-full').onclick=e=>{e.preventDefault();klijentModal(null,v,k=>{$('#f-klijent').value=k.naziv;onKlijent()})}}
}
function fillLokList(){
  const el=$('#dl-lokacije');if(!el)return;
  const k=$('#f-klijent')?kByName($('#f-klijent').value):null;
  el.innerHTML=lokacijeOf(k).map(l=>`<option value="${esc(lokLabel(l))}">${esc([l.mjesto,l.adresa].filter(Boolean).join(', '))}</option>`).join('');
}
function lokHint(){
  const h=$('#h-lok');if(!h)return;
  const k=kByName($('#f-klijent').value),v=$('#f-lokacija').value.trim();
  if(!v){const n=lokacijeOf(k).length;h.textContent=k&&n>1?`${n} poslovnih jedinica, izaberi sa liste`:'';h.className='hint';return}
  if(k&&findLok(k,v)){h.textContent='✓ Poslovna jedinica iz baze';h.className='hint ok'}
  else{h.textContent=k?'Nova poslovna jedinica, biće dodana klijentu pri čuvanju':'';h.className='hint new'}
}
function onKlijent(){
  klijentHint(); fillLokList();
  const k=kByName($('#f-klijent').value);if(!k){lokHint();return}
  setR('ugovor',k.ugovor?'DA':'NE');
  const ls=lokacijeOf(k), sel=findLok(k,$('#f-lokacija').value);
  if(ls.length===1&&!sel){$('#f-lokacija').value=lokLabel(ls[0]);onLok()}
  else if(!sel){$('#f-lokacija').value='';$('#f-lokacija').focus()}
  lokHint();
}
function onLok(){
  lokHint();
  const k=kByName($('#f-klijent').value),l=findLok(k,$('#f-lokacija').value);if(!l)return;
  $('#f-adresa').value=[l.adresa,[l.postanskiBroj,l.mjesto].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  $('#f-kontakt').value=[l.kontakt,l.telefon,l.email].filter(Boolean).join(', ');
  $('#f-dest').value=l.mjesto||l.naziv||'';
  if(l.km){$('#f-km1').value=l.km;$('#f-km2').value=l.km}else{$('#f-km1').value='';$('#f-km2').value=''}
  calcTravel();
}
function devHint(r){
  const s=r.querySelector('.d-ser').value.trim(),h=r.querySelector('.d-h');
  if(!s){h.textContent='';h.className='hint d-h';return}
  const u=uBySer(s);
  if(u){const k=kById(u.klijentId);h.textContent='✓ '+([k?.naziv,lokLabel(lokById(k,u.lokacijaId))].filter(Boolean).join(' · ')||'u bazi');h.className='hint d-h ok'}

/* ---------- potpis ---------- */
let padS,padK;
function pad(cv,init){
  const ctx=cv.getContext('2d');let drawing=false,dirty=!!init,last=null;
  const reset=()=>{ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14202c'};
  reset();
  if(init){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=init}
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener('pointerdown',e=>{drawing=true;dirty=true;last=pt(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],1.4,0,7);ctx.fillStyle='#14202c';ctx.fill()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p});
  const end=()=>{drawing=false};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  return{clear(){reset();dirty=false},get(){return dirty?cv.toDataURL('image/png'):''}};
}

async function nextBroj(){
  const ref=db.doc('postavke/brojac'),holder='h'+Math.random().toString(36).slice(2);
  for(let i=0;i<8;i++){
    const r=await ref.acquire({holder,ttlMs:8000});
    if(r.acquired){
      const s=await ref.get();const d=s.exists?s.data():{};const y=new Date().getFullYear();
      let next=(d.godina===y?(d.zadnji||0):0)+1; if(d.godina===y&&d.sljedeci&&d.sljedeci>next)next=d.sljedeci;
      await ref.set({godina:y,zadnji:next,sljedeci:0});
      return `${String(next).padStart(4,'0')}/${y}`;
    }
    await new Promise(res=>setTimeout(res,500+Math.random()*500));
  }
  throw{message:'Brojač naloga je zauzet, pokušaj ponovo.'};
}

const safeName=s=>String(s||'').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');

async function makePdf(print){
  const n=collect();const b=$(print?'#print':'#pdf'),lbl=b.textContent;$('#pdf').disabled=$('#print').disabled=true;b.textContent='Pravim PDF…';
  try{
    if(!window.html2canvas||!window.jspdf)throw{message:'PDF biblioteka se nije učitala'};
    const root=$('#print-root');root.innerHTML=sheet(n);
    await Promise.all([...root.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    const canvas=await html2canvas(root.firstElementChild,{scale:2,backgroundColor:'#ffffff'});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    let w=210,h=canvas.height*w/canvas.width;if(h>297){h=297;w=canvas.width*h/canvas.height}
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',(210-w)/2,0,w,h);
    root.innerHTML='';
    if(print)pdf.autoPrint({variant:'non-conforming'});
    pdf.setProperties({title:fileName(n).replace(/\.pdf$/,'')});
    if(!downloads)throw{message:'Preuzimanje fajlova nije dostupno u ovom prikazu'};
    await downloads.save({filename:fileName(n),data:pdf.output('blob')});
    toast(print?'PDF je preuzet. Otvori ga i odmah se otvara štampa.':'PDF je sačuvan');
  }catch(e){if(e?.code!=='declined')toast('PDF nije napravljen: '+(e?.message||e?.code||'greška'))}
  finally{b.textContent=lbl;$('#pdf').disabled=$('#print').disabled=false}
}

    <div class="foot">${k?'<button class="ghost" id="m-del">Obriši</button>':''}<span style="flex:1"></span><button id="m-x">Odustani</button><button class="primary" id="m-ok">Sačuvaj</button></div>`,

      const row=b.closest('.lokrow'),used=k&&(S.uredjaji.some(u=>u.klijentId===k.id&&u.lokacijaId===row.dataset.id)||S.nalozi.some(n=>n.klijentId===k.id&&n.lokacijaId===row.dataset.id));
      if(used&&!b.dataset.c){b.dataset.c=1;b.textContent='Jedinica ima uređaje ili naloge. Ipak ukloni?';return}
      row.remove();
    });
    wire();
    m.querySelector('#m-addlok').onclick=()=>{m.querySelector('#m-loks').insertAdjacentHTML('beforeend',lokRowHtml({id:newId()}));wire();m.querySelector('#m-loks .lokrow:last-child .l-naziv').focus()};
    m.querySelector('#m-ok').onclick=async()=>{
      const v=(r,c)=>r.querySelector(c).value.trim();
      const lokacije=[...m.querySelectorAll('.lokrow')].map(r=>({id:r.dataset.id,naziv:v(r,'.l-naziv'),mjesto:v(r,'.l-mjesto'),adresa:v(r,'.l-adresa'),postanskiBroj:v(r,'.l-ptt'),radnoVrijeme:v(r,'.l-rv'),km:num(v(r,'.l-km')),kontakt:v(r,'.l-kon'),telefon:v(r,'.l-tel'),email:v(r,'.l-mail')})).filter(l=>l.naziv||l.mjesto||l.adresa);
      const body={naziv:m.querySelector('#m-naziv').value.trim(),skracenica:m.querySelector('#m-skr').value.trim(),ugovor:m.querySelector('#m-ug').checked,lokacije};
      if(!body.naziv){toast('Upiši naziv');return}

      const dup=kByName(body.naziv);if(dup&&(!k||dup.id!==k.id)){toast('Klijent s tim nazivom već postoji');return}
      const names=lokacije.map(l=>norm(lokLabel(l)));if(new Set(names).size!==names.length){toast('Dvije poslovne jedinice imaju isti naziv');return}
      try{
        let id=k?.id;
        if(k)await db.doc('klijenti/'+id).set({...body,kreiran:k.kreiran||Date.now()});else{const ref=db.collection('klijenti').doc();id=ref.id;await ref.set({...body,kreiran:Date.now()})}
        S.klijenti=S.klijenti.filter(x=>x.id!==id).concat([{id,...body}]);

      }catch(e){toast('Nije sačuvano: '+(e?.message||e?.code))}

    const del=m.querySelector('#m-del');
    if(del)del.onclick=async()=>{if(!del.dataset.c){del.dataset.c=1;del.textContent='Potvrdi brisanje';return}await db.doc('klijenti/'+k.id).delete();close();toast('Klijent obrisan')};
  });

/* ---------- uvoz poslovnih jedinica iz Excela ---------- */
const CYR={'А':'A','Б':'B','В':'V','Г':'G','Д':'D','Ђ':'Đ','Е':'E','Ж':'Ž','З':'Z','И':'I','Ј':'J','К':'K','Л':'L','Љ':'Lj','М':'M','Н':'N','Њ':'Nj','О':'O','П':'P','Р':'R','С':'S','Т':'T','Ћ':'Ć','У':'U','Ф':'F','Х':'H','Ц':'C','Ч':'Č','Џ':'Dž','Ш':'Š'};
Object.keys(CYR).forEach(c=>CYR[c.toLowerCase()]=CYR[c].toLowerCase());
const lat=s=>String(s??'').replace(/[Ѐ-ӿ]/g,c=>CYR[c]??c);
const IMP_FIELDS=[
  ['naziv','Naziv jedinice',['jedinic','naziv','organizac','poslovn','filijal','ispostav']],
  ['mjesto','Mjesto',['mjesto','mesto','grad','opstin','opštin']],
  ['adresa','Adresa',['adres','ulica']],
  ['postanskiBroj','Poštanski broj',['postan','poštan','ptt','zip']],
  ['telefon','Telefon',['tel','phone','mob']],
  ['radnoVrijeme','Radno vrijeme',['radno','vrijeme','vreme']],
  ['kontakt','Kontakt osoba',['kontakt','osoba','odgovor']],
  ['email','E-mail',['mail']],
  ['km','Km od BL',['km','udalj']],
];
const fixPhone=s=>{s=String(s??'').trim();const m=s.match(/\d{3}[\s\/-]?\d{3}[\s\/-]?\d{3,4}/g);return m&&m.length>1?m.join(', '):s};
const mjestoIzNaziva=n=>{const m=n.match(/^(PJ|PK|PJ\.|PK\.)\s+(.+)$/i);return m?m[2].trim():''};
function guessMap(header){
  const map={};const used=new Set();
  IMP_FIELDS.forEach(([f,,keys])=>{const i=header.findIndex((h,ix)=>!used.has(ix)&&keys.some(k=>norm(lat(h)).includes(k)));if(i>=0){map[f]=i;used.add(i)}});
  return map;
}
function findHeader(rows){
  let best=0,score=-1;
  rows.slice(0,15).forEach((r,i)=>{const s=Object.keys(guessMap(r.map(x=>String(x??'')))).length;if(s>score){score=s;best=i}});
  return best;
}
function importModal(){
  let rows=[],hdr=0,map={};
  modal(`<h1>Uvoz poslovnih jedinica</h1>
    <div class="muted">Tabela treba imati po jedan red za svaku poslovnu jedinicu. Kolone se prepoznaju po zaglavlju (naziv, adresa, poštanski broj, telefon, radno vrijeme…), a ispod ih možeš ručno prepraviti. Jedinica koja već postoji (isti naziv ili ista adresa) se ažurira, ostale se dodaju.</div>
    <label class="f"><span>Klijent</span><input id="i-kl" list="dl-klijenti" placeholder="Postojeći ili novi klijent"></label>
    <label class="f"><span>Excel ili CSV fajl</span><input id="i-file" type="file" accept=".xlsx,.xls,.csv,.ods"></label>
    <label class="check"><input type="checkbox" id="i-lat" checked> Ćirilicu pretvori u latinicu</label>
    <div id="i-map"></div><div id="i-prev"></div>
    <div class="foot"><span style="flex:1"></span><button id="i-x">Odustani</button><button class="primary" id="i-ok" disabled>Uvezi</button></div>`,
  (m,close)=>{
    m.style.maxWidth='860px';
    m.querySelector('#i-x').onclick=close;
    const build=()=>{
      const conv=m.querySelector('#i-lat').checked?lat:(x=>String(x??''));
      const k=kByName(m.querySelector('#i-kl').value);
      const out=[];
      rows.slice(hdr+1).forEach(r=>{
        const g=f=>map[f]!=null?String(r[map[f]]??'').trim():'';
        const naziv=conv(g('naziv'));if(!naziv)return;
        const l={naziv,mjesto:conv(g('mjesto'))||mjestoIzNaziva(naziv),adresa:conv(g('adresa')),postanskiBroj:g('postanskiBroj'),telefon:fixPhone(g('telefon')),radnoVrijeme:g('radnoVrijeme'),kontakt:conv(g('kontakt')),email:g('email'),km:num(g('km'))};
        const ex=k&&(findLok(k,naziv)||(l.adresa&&lokacijeOf(k).find(x=>x.adresa&&norm(x.adresa)===norm(l.adresa))));
        out.push({l,ex});
      });
      return out;
    };
    const preview=()=>{
      const head=rows[hdr]||[];
      m.querySelector('#i-map').innerHTML=`<h2 style="margin-bottom:8px">Kolone</h2><div class="g">${IMP_FIELDS.map(([f,t])=>`<label class="f"><span>${t}</span><select data-f="${f}"><option value="">—</option>${head.map((h,i)=>`<option value="${i}"${map[f]===i?' selected':''}>${esc(lat(h)||'kolona '+(i+1))}</option>`).join('')}</select></label>`).join('')}</div>`;
      m.querySelectorAll('#i-map select').forEach(s=>s.onchange=()=>{if(s.value==='')delete map[s.dataset.f];else map[s.dataset.f]=+s.value;preview()});
      const out=build(),nNew=out.filter(o=>!o.ex).length,nUpd=out.length-nNew;
      m.querySelector('#i-prev').innerHTML=out.length?`<h2 style="margin:6px 0 8px">Pregled: ${out.length} jedinica (${nNew} novih, ${nUpd} za ažuriranje)</h2>
        <div class="tablebox" style="max-height:320px;overflow:auto"><table><thead><tr><th></th><th>Naziv</th><th>Mjesto</th><th>Adresa</th><th>PTT</th><th>Telefon</th><th>Radno vr.</th></tr></thead><tbody>
        ${out.map(({l,ex})=>`<tr><td>${ex?'<span class="chip u_radu">ažurira</span>':'<span class="chip zavrsen">nova</span>'}</td><td>${esc(l.naziv)}</td><td>${esc(l.mjesto)}</td><td>${esc(l.adresa)}</td><td class="mono">${esc(l.postanskiBroj)}</td><td class="mono">${esc(l.telefon)}</td><td class="mono">${esc(l.radnoVrijeme)}</td></tr>`).join('')}</tbody></table></div>`
        :'<div class="muted">Nema redova sa nazivom jedinice. Provjeri koja kolona je „Naziv jedinice”.</div>';
      m.querySelector('#i-ok').disabled=!out.length;
      m.querySelector('#i-ok').textContent=out.length?`Uvezi ${out.length} jedinica`:'Uvezi';
    };
    m.querySelector('#i-file').onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      if(!window.XLSX){toast('Biblioteka za Excel se nije učitala');return}
      try{
        const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}).filter(r=>r.some(c=>String(c).trim()));
        hdr=findHeader(rows);map=guessMap((rows[hdr]||[]).map(x=>String(x??'')));
        if(!m.querySelector('#i-kl').value.trim()){const nm=f.name.replace(/\.[^.]+$/,'');if(!/^book|^sheet|^tabela/i.test(nm))m.querySelector('#i-kl').value=nm}
        preview();
      }catch(err){toast('Fajl nije pročitan: '+(err?.message||'nepoznat format'))}
    };
    m.querySelector('#i-lat').onchange=()=>rows.length&&preview();
    m.querySelector('#i-kl').oninput=()=>rows.length&&preview();
    m.querySelector('#i-ok').onclick=async()=>{
      const kn=m.querySelector('#i-kl').value.trim();if(!kn){toast('Upiši ili izaberi klijenta');m.querySelector('#i-kl').focus();return}
      if(!db){toast('Baza nije dostupna');return}
      const k=kByName(kn),out=build();
      const loks=lokacijeOf(k).map(x=>({...x}));
      out.forEach(({l,ex})=>{
        if(ex){const t=loks.find(x=>x.id===ex.id);for(const[f,v]of Object.entries(l)){if(f==='naziv')continue;if(f==='kontakt'&&t.kontakt)continue;if(f==='telefon'&&t.telefon&&v&&!norm(t.telefon).includes(norm(v))){t.telefon=t.telefon+', '+v;continue}if(v!==''&&v!==0)t[f]=v}}
        else loks.push({id:newId(),...l});
      });
      const b=m.querySelector('#i-ok');b.disabled=true;b.textContent='Uvozim…';
      try{
        if(k){const{id:_i,...rest}=k;await db.doc('klijenti/'+k.id).set({...rest,kreiran:k.kreiran||Date.now(),lokacije:loks})}
        else await db.collection('klijenti').add({naziv:kn,ugovor:false,kreiran:Date.now(),lokacije:loks});
        close();toast(`Uvezeno ${out.length} poslovnih jedinica`);
      }catch(e){b.disabled=false;b.textContent='Uvezi';toast('Uvoz nije uspio: '+(e?.message||e?.code))}
    };
  });
}

    <div class="card"><h2>Obračun i numeracija</h2>
      <label class="f"><span>Tarifa putnih troškova (KM po km)</span><input id="n-tar" inputmode="decimal" value="${esc(S.postavke.tarifaKm??'')}"></label>
      <label class="f"><span>Sljedeći broj naloga u ${new Date().getFullYear()}.</span><input id="n-br" inputmode="numeric" placeholder="${(S.brojac.godina===new Date().getFullYear()?(S.brojac.zadnji||0):0)+1}"></label>
      <div class="muted" style="font-size:13px">Broj se dodjeljuje pri prvom čuvanju naloga, u obliku <span class="mono">0001/${new Date().getFullYear()}</span>. Upiši broj samo ako nastavljaš postojeću numeraciju.</div>
      <div><button class="primary" id="a-post">Sačuvaj postavke</button></div></div>
  </div>`;
  const add=async(col,inp,key)=>{const v=$(inp).value.trim();if(!v||!db)return;await db.collection(col).add({[key]:v});$(inp).value=''};
  $('#a-ser').onclick=()=>add('serviseri','#n-ser','ime');$('#n-ser').onkeydown=e=>{if(e.key==='Enter')add('serviseri','#n-ser','ime')};
  $('#a-mat').onclick=()=>add('materijali','#n-mat','naziv');$('#n-mat').onkeydown=e=>{if(e.key==='Enter')add('materijali','#n-mat','naziv')};
  const addTip=async()=>{const v=$('#n-tip').value.trim();if(!v||!db)return;if(S.tipovi.some(t=>norm(t.naziv)===norm(v))){toast('Taj tip već postoji');return}await db.collection('tipovi').add({naziv:v,brojac:$('#n-tipb').checked});$('#n-tip').value=''};
  $('#a-tip').onclick=addTip;$('#n-tip').onkeydown=e=>{if(e.key==='Enter')addTip()};
  el.querySelectorAll('[data-tipb]').forEach(c=>c.onchange=()=>db&&db.doc('tipovi/'+c.dataset.tipb).update({brojac:c.checked}));
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent='Sigurno?';return}await db.doc(b.dataset.del).delete()});
  $('#a-post').onclick=async()=>{
    if(!db)return;
    try{
      await db.doc('postavke/opste').set({...S.postavke,tarifaKm:num($('#n-tar').value)});
      const nb=parseInt($('#n-br').value,10);
      if(nb>0){const y=new Date().getFullYear();await db.doc('postavke/brojac').set({godina:y,zadnji:nb-1,sljedeci:0})}
      toast('Postavke sačuvane');
    }catch(e){toast('Nije sačuvano: '+(e?.message||e?.code))}
  };
}

/* ---------- start ---------- */
function onErr(e){if(e?.code==='revoked')banner('Pristup bazi je ukinut za ovaj prikaz.');else if(e?.code!=='unavailable')console.warn(e)}
(async()=>{
  $('#brand-logo').src=LOGO;
  const v=(location.hash||'').slice(1);
  show(['nalozi','klijenti','uredjaji','sifarnici'].includes(v)?v:'nalozi');
  try{db=window.claude?await window.claude.use('db'):null}catch(e){db=null}
  try{downloads=window.claude?await window.claude.use('downloads'):null}catch(e){downloads=null}
  if(!db){S.ready=true;banner('Baza nije dostupna u ovom prikazu. Otvori stranicu prijavljen na claude.ai da bi se nalozi čuvali.');render();return}
  const need=new Set(['klijenti','uredjaji','materijali','serviseri','nalozi','tipovi']);
  const sub=(name,qy)=>qy.onSnapshot(s=>{S[name]=s.docs.map(d=>({id:d.id,...d.data()}));need.delete(name);if(!need.size)S.ready=true;render()},onErr);
  sub('klijenti',db.collection('klijenti').orderBy('naziv'));
  sub('uredjaji',db.collection('uredjaji').orderBy('serijski'));
  sub('materijali',db.collection('materijali').orderBy('naziv'));
  sub('serviseri',db.collection('serviseri').orderBy('ime'));
  sub('tipovi',db.collection('tipovi').orderBy('naziv'));
  sub('nalozi',db.collection('nalozi').orderBy('kreiran','desc').limit(1000));
  db.doc('postavke/opste').onSnapshot(s=>{S.postavke=s.exists?s.data():{};if(view==='sifarnici')renderSifarnici()},onErr);
  db.doc('postavke/brojac').onSnapshot(s=>{S.brojac=s.exists?s.data():{};if(view==='sifarnici')renderSifarnici()},onErr);
})();
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['nalozi','klijenti','uredjaji','sifarnici'].includes(v)&&v!==view)show(v)});
</script>
